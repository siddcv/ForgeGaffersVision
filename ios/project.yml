# XcodeGen spec for the iPhone app: `xcodegen` turns this into GaffersVision.xcodeproj (not kept in
# git), then `pod install` adds MediaPipe and writes GaffersVision.xcworkspace, the file to open.
# See README.md. Model files come from the repo's models/ folder (git-ignored; README step 2).
name: GaffersVision
options:
  bundleIdPrefix: edu.northwestern.forge
  deploymentTarget:
    iOS: "17.0"
packages:
  GaffersVisionCore:
    path: ../swift/GaffersVisionCore
targets:
  GaffersVision:
    type: application
    platform: iOS
    sources:
      - path: GaffersVision
      # Core ML models: compiled by Xcode (Sources phase), which also enables the Performance tab.
      - path: ../models/yolov8n_320.mlpackage
        type: file
        buildPhase: sources
      - path: ../models/yolov8n_640.mlpackage
        type: file
        buildPhase: sources
      # MediaPipe pose model, copied as-is (the same file the Python code downloads).
      - path: ../models/pose_landmarker_lite.task
        type: file
        buildPhase: resources
      # MediaPipe face model for head pitch (src/face_pose.py downloads the same file).
      - path: ../models/face_landmarker.task
        type: file
        buildPhase: resources
    dependencies:
      - package: GaffersVisionCore
    info:
      path: GaffersVision/Info.plist
      properties:
        CFBundleDisplayName: Gaffer's Vision
        NSCameraUsageDescription: The camera watches your tick-tock drill. Video stays on this phone.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait]
    settings:
      base:
        # Change to something unique to you if Xcode says the identifier is taken.
        PRODUCT_BUNDLE_IDENTIFIER: edu.northwestern.forge.gaffersvision
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # CocoaPods' build scripts fail under Xcode's script sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
